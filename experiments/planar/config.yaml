# Complete configuration for the experimental no-warp planar ablation.
experiment:
  name: planar-average-var-size
  seed: 1234
model:
  pipeline: planar_sana
  id: Efficient-Large-Model/Sana_1600M_1024px_BF16_diffusers
  path: null
  revision: null
  variant: bf16
  precision: bf16
  cpu_offload: false
  vae_tiling: false
  vae_slicing: false
  additional_pipeline_kwargs: {}
prompt:
  path: prompts/ruins.txt
  negative_path: null
output:
  directory: outputs
  save_final: true
  save_metadata: true
  save_intermediate: false
  run_id: null
  fps: 24
generation:
  num_inference_steps: 20
  guidance_scale: 4.5
  height: 2048
  width: 4096
  num_frames: null
  use_resolution_binning: false
  additional_call_kwargs: {}
sphere:
  num_points: 2600
  fov: null
  erp_height: 2048
  erp_width: 4096
  weighted_average_temperature: 0.1
fusion:
  enabled: false
  start_ratio: 0.0
  end_ratio: 1.0
  every_n_steps: 1
  warp: {mode: standard}
  lpw:
    levels: 4
    lod_mode: jacobian
    lod_interpolation: linear
    erp_vertical_padding_mode: reflect
    erp_to_perspective_interpolation_mode: bilinear
  time_travel:
    enabled: false                    # Reserved; true raises until a backend step runner is implemented.
    every_n_steps: 1
    jump_length: 1
    num_repeats: 1
    strength: 1.0
  aggregation:
    mode: weighted_average
    weight_mode: distance_to_boundary
    alpha: 1.0
    power: 1.0
    epsilon: 1.0e-6
reinjection: {mode: noise_consistent, strength: 1.0}
writeback:
  mode: exclusive
  owner_mode: max_center_weight
  owner_map_static: true
  uncovered_mode: error
performance:
  vae_chunk_size: 4
  projection_chunk_size: 1
  vae_sample_posterior: false
debug:
  enabled: false
  save_predicted_x0: false
  save_original_clean_erp: false
  save_fused_erp: false
  save_owner_map: false
  save_projection_diagnostics: false
  save_masks: false
  measure_performance: false
planar:
  patch_latent_height: 20
  patch_latent_width: 20
  patch_stride_height: 5
  patch_stride_width: 5
  fusion_space: pixel
  aggregation_mode: average
  weight_mode: distance_to_boundary
  dpa_alpha: 1.0
  dpa_power: 1.0
  dpa_eps: 1.0e-6
  reinjection_mode: noise_consistent
  reinjection_strength: 1.0
  latent_writeback_mode: exclusive
  vae_chunk_size: 4
  vae_sample_posterior: false
  save_diagnostics: false
  diagnostics_dir: null
