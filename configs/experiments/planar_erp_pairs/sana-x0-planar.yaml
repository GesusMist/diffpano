experiment: {name: sana-planar_x0_consensus-camera_index-average-uniform, seed: 0}
model:
  pipeline: sana
  id: Efficient-Large-Model/Sana_1600M_1024px_BF16_diffusers
  variant: bf16
  precision: bf16
  vae_tiling: false
canvas: {mode: planar}
global_pipeline:
  mode: erp_x0_consensus
  clean_consensus: {noise_binding: camera_index, noise_storage: cpu, noise_dtype: fp32}
native_multidiffusion:
  canvas_height: 32
  canvas_width: 64
  patch_size: 32
  stride: 16
  prompt_assignment: global
planar:
  geometry_preset: custom
  height: 1024
  width: 2048
  patch_size: 1024
  stride: 512
  patch_strategy: fixed
  prompt_assignment: global
prompt: {path: prompts/native_control.txt}
generation: {num_inference_steps: 20, guidance_scale: 4.5, true_cfg_scale: 1.0, batch_size: 1}
warp: {mode: standard}
fusion: {mode: average, weight_mode: uniform}
debug: {overlap_disagreement: true, measure_performance: true}
output: {directory: outputs, group: geometry-pairs}
view: {height: 1024, width: 1024, fov_x: 80.0, fov_y: 80.0}
erp: {height: 1024, width: 2048}
