experiment: {name: pixeldit-planar_rgb_state-global_rgb_canvas-average-uniform, seed: 0}
model:
  pipeline: pixeldit
  id: null
  variant: null
  precision: bf16
  vae_tiling: false
canvas: {mode: planar}
global_pipeline:
  mode: erp_rgb_state
  clean_consensus: {noise_binding: camera_index, noise_storage: cpu, noise_dtype: fp32}
native_multidiffusion:
  canvas_height: 1024
  canvas_width: 2048
  patch_size: 1024
  stride: 512
  prompt_assignment: global
planar:
  geometry_preset: custom
  height: 1024
  width: 2048
  patch_size: 1024
  stride: 512
  patch_strategy: fixed
  prompt_assignment: global
prompt: {path: prompts/native_control.txt}
generation: {num_inference_steps: 50, guidance_scale: 1.0, true_cfg_scale: 1.0, batch_size: 1}
warp: {mode: standard}
fusion: {mode: average, weight_mode: uniform}
debug: {overlap_disagreement: true, measure_performance: true}
output: {directory: outputs, group: geometry-pairs}
initialization: {mode: pixel_gaussian, std: 1.0, clamp: false}
view: {height: 1024, width: 1024, fov_x: 80.0, fov_y: 80.0}
erp: {height: 1024, width: 2048}
