experiment: {name: sd2-planar_rgb_state-global_rgb_canvas-average-uniform, seed: 0}
model:
  pipeline: sd2
  id: sd2-community/stable-diffusion-2-base
  variant: null
  precision: fp16
  vae_tiling: true
canvas: {mode: planar}
global_pipeline:
  mode: erp_rgb_state
  clean_consensus: {noise_binding: camera_index, noise_storage: cpu, noise_dtype: fp32}
native_multidiffusion:
  canvas_height: 64
  canvas_width: 128
  patch_size: 64
  stride: 32
  prompt_assignment: global
planar:
  geometry_preset: custom
  height: 512
  width: 1024
  patch_size: 512
  stride: 256
  patch_strategy: fixed
  prompt_assignment: global
prompt: {path: prompts/native_control.txt}
generation: {num_inference_steps: 30, guidance_scale: 7.5, true_cfg_scale: 1.0, batch_size: 1}
warp: {mode: standard}
fusion: {mode: average, weight_mode: uniform}
debug: {overlap_disagreement: true, measure_performance: true}
output: {directory: outputs, group: representation-controls}
initialization: {mode: canvas_rgb_noise, std: 1.0, clamp: false}
