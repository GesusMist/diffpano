experiment: {name: flux-erp_x0_consensus-camera_index-detail_preserving_average-distance_to_boundary-lpw_dpa, seed: 0}
model:
  pipeline: flux
  id: ModelsLab/flux.1-dev
  variant: null
  precision: bf16
  vae_tiling: true
canvas: {mode: erp}
global_pipeline:
  mode: erp_x0_consensus
  clean_consensus: {noise_binding: camera_index, noise_storage: cpu, noise_dtype: fp32}
native_multidiffusion:
  canvas_height: 128
  canvas_width: 256
  patch_size: 128
  stride: 64
  prompt_assignment: global
planar:
  geometry_preset: custom
  height: 1024
  width: 2048
  patch_size: 1024
  stride: 512
  patch_strategy: fixed
  prompt_assignment: global
prompt: {path: prompts/native_control.txt}
generation: {num_inference_steps: 20, guidance_scale: 3.5, true_cfg_scale: 1.0, batch_size: 1}
warp: {mode: lpw}
fusion: {mode: detail_preserving_average, weight_mode: distance_to_boundary}
debug: {overlap_disagreement: true, measure_performance: true}
output: {directory: outputs, group: erp-later}
view: {height: 1024, width: 1024, fov_x: 80.0, fov_y: 80.0}
erp: {height: 1024, width: 2048}
