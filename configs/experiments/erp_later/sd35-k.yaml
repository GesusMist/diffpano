# Scientific control F; use scripts.controlled_ladder --phase F.
experiment: {name: sd35-F-global_native_canvas-average-uniform, seed: 0}
model:
  pipeline: sd35
  id: stabilityai/stable-diffusion-3.5-medium
  revision: b940f670f0eda2d07fbb75229e779da1ad11eb80
  variant: null
  precision: bf16
  vae_tiling: false
  additional_pipeline_kwargs: {local_files_only: true}
canvas: {mode: erp}
global_pipeline: {mode: erp_local_current_consensus}
native_multidiffusion:
  canvas_height: 128
  canvas_width: 256
  patch_size: 128
  stride: 64
  prompt_assignment: global
planar: {prompt_assignment: global}
prompt: {path: prompts/native_control.txt}
generation: {num_inference_steps: 40, guidance_scale: 4.5, true_cfg_scale: 1.0, batch_size: 1}
warp: {mode: standard}
fusion: {mode: average, weight_mode: uniform}
debug: {overlap_disagreement: true, measure_performance: true}
output: {directory: outputs, group: rgb-endpoint-controls}

consensus_transition: {mode: preserve_current_state, vae_residual_correction: false}

view: {height: 1024, width: 1024, fov_x: 100.0, fov_y: 100.0}
erp: {height: 1024, width: 2048}
sampling: {strategy: cube6_fixed, rotation: {enabled: false}}
