experiment: {name: sd2-implied_endpoint_consensus-global_native_canvas-average-uniform, seed: 0}
model:
  pipeline: sd2
  id: sd2-community/stable-diffusion-2-base
  variant: null
  precision: fp16
  vae_tiling: true
canvas: {mode: erp}
global_pipeline: {mode: erp_local_dense_consensus}
native_multidiffusion:
  canvas_height: 64
  canvas_width: 128
  patch_size: 64
  stride: 32
  prompt_assignment: global
planar: {prompt_assignment: global}
prompt: {path: prompts/native_control.txt}
generation: {num_inference_steps: 30, guidance_scale: 7.5, true_cfg_scale: 1.0, batch_size: 1}
warp: {mode: standard}
fusion: {mode: detail_preserving_average, weight_mode: uniform}
debug: {overlap_disagreement: true, measure_performance: true}
output: {directory: outputs, group: rgb-endpoint-controls}

consensus_transition: {mode: preserve_current_state, vae_residual_correction: false}

view: {height: 512, width: 512, fov_x: 80.0, fov_y: 80.0}
erp: {height: 512, width: 1024}
sampling: {strategy: spherediff_fixed, rotation: {enabled: false}}

dense_consensus:
  experiment: N
  geometry_file: outputs/vae-residual-controls/20260915-dense-lm/geometry/experiment_l.json
  prompt_assignment: spherediff_directional
