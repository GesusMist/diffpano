experiment:
  name: pixeldit_smoke
  seed: 0

model:
  pipeline: pixeldit
  id: null
  path: null
  revision: null
  variant: null
  precision: bf16
  cpu_offload: false
  vae_tiling: false
  vae_slicing: false
  additional_pipeline_kwargs: {}

pixeldit:
  repo_path: third_party/PixelDiT
  config_path: third_party/PixelDiT/t2i/configs/PixelDiT_1024px_pixel_diffusion_stage3.yaml
  model_path: null
  checkpoint_name: pixeldit_t2i_v1.pth
  expected_commit: 41f73006ae532b0b41fee72b181dc22891a5a01a
  cfg_scale: 2.75
  negative_prompt: "low quality, worst quality, over-saturated, blurry, deformed, watermark"
  flow_shift: null
  interval_guidance: [0.0, 1.0]
  release_text_encoder: true
  record_state_statistics: true

prompt:
  path: prompts/ruins.txt
  negative_path: null

generation:
  num_inference_steps: 1
  guidance_scale: 1.0
  true_cfg_scale: 1.0
  batch_size: 1

erp:
  height: 256
  width: 512

view:
  height: 256
  width: 256
  fov_x: 80.0
  fov_y: 80.0

sampling:
  strategy: spherediff_fixed
  rotation:
    enabled: false
    max_yaw_deg: 6.0
    max_pitch_deg: 3.0
    max_roll_deg: 2.0

initialization:
  mode: pixel_gaussian
  distribution: gaussian
  mean: 0.0
  std: 1.0
  clamp: false
  clamp_min: -1.0
  clamp_max: 1.0

warp:
  mode: standard
  erp_to_perspective:
    interpolation: nearest
  perspective_to_erp:
    interpolation: bilinear
  lpw:
    levels: 4
    lod_mode: jacobian
    lod_interpolation: nearest
    vertical_padding_mode: reflect

fusion:
  mode: average
  weight_mode: uniform
  spherediff_temperature: 0.1
  alpha: 1.0
  power: 1.0
  epsilon: 1.0e-6
  uncovered_mode: keep_previous

performance:
  view_batch_size: 1
  vae_chunk_size: 1
  projection_cache_max_entries: 2
  projection_cache_cpu_fallback: false

output:
  directory: outputs
  group: pixeldit-smoke
  save_final: true
  save_metadata: true
  save_intermediate: false
  run_id: null

debug:
  enabled: false
  save_views_before_denoise: false
  save_views_after_denoise: false
  save_erp_each_step: false
  save_masks: false
  save_step_indices: []
  save_view_indices: []
  save_weights: false
  save_lod_maps: false
  measure_performance: true
