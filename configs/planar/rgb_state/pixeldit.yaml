experiment: {name: planar-rgb-state-pixeldit-ruins, seed: 0}
model:
  pipeline: pixeldit
  id: null
  variant: null
  precision: bf16
global_pipeline: {mode: erp_rgb_state}
canvas: {mode: planar}
planar:
  height: 2048
  width: 4096
  patch_size: 160
  stride: 50
  patch_strategy: fixed
  dynamic_step_size: 64
  prompt_assignment: legacy_directional
prompt: {path: prompts/ruins.txt}
generation: {num_inference_steps: 50, guidance_scale: 1.0, batch_size: 1}
initialization: {mode: pixel_gaussian, distribution: gaussian, mean: 0.0, std: 1.0, clamp: false}
warp: {mode: standard}
fusion: {mode: average, weight_mode: uniform}
performance: {view_batch_size: 1, vae_chunk_size: 1}
output: {directory: outputs, group: planar-rgb-state}
