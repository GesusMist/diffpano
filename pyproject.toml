[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffpano"
version = "0.2.0"
description = "Panoramic diffusion with a persistent ERP RGB canvas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.4.0",
  "diffusers==0.32.2",
  "einops==0.8.1",
  "huggingface-hub>=0.27",
  "numpy>=1.24",
  "omegaconf==2.3.0",
  "Pillow>=10",
  "protobuf==5.29.3",
  "sentencepiece==0.2.0",
  "transformers==4.49.0",
]

[project.scripts]
diffpano-generate = "scripts.generate:main"
diffpano-download-models = "scripts.download_models:main"

[tool.setuptools.packages.find]
include = ["diffpano*", "scripts*", "spherediff*", "experiments.legacy_spherical*"]

[tool.autopep8]
max_line_length = 120
