# Main DiffPano experiment: the only persistent global state is ERP RGB [B,3,H,W].
experiment:
  name: erp-rgb-sana
  seed: 0

model:
  pipeline: sana                 # sana or flux
  id: Efficient-Large-Model/Sana_1600M_1024px_BF16_diffusers
  path: null
  revision: null
  variant: bf16
  precision: bf16
  cpu_offload: false
  vae_tiling: false
  vae_slicing: false
  additional_pipeline_kwargs: {}

prompt:
  path: prompts/ruins.txt
  negative_path: null

generation:
  num_inference_steps: 20
  guidance_scale: 4.5
  true_cfg_scale: 1.0           # FLUX true CFG; SANA ignores it
  batch_size: 1

erp:
  height: 2048
  width: 4096

view:
  height: 1024
  width: 1024
  fov_x: 80.0
  fov_y: 80.0

sampling:
  strategy: spherediff_fixed    # spherediff_fixed or spherediff_rotated
  rotation:
    enabled: false
    max_yaw_deg: 6.0
    max_pitch_deg: 3.0
    max_roll_deg: 2.0

initialization:
  mode: erp_rgb_noise           # erp_rgb_noise or latent_native_bootstrap
  distribution: gaussian
  mean: 0.0
  std: 1.0
  clamp: false
  clamp_min: -1.0
  clamp_max: 1.0

warp:
  mode: lpw                     # standard or lpw
  erp_to_perspective:
    interpolation: nearest
  perspective_to_erp:
    interpolation: bilinear
  lpw:
    levels: 4
    lod_mode: jacobian          # jacobian or none
    lod_interpolation: nearest  # nearest or linear; separate from spatial interpolation
    vertical_padding_mode: reflect

fusion:
  mode: detail_preserving_average  # average, weighted_average, detail_preserving_average
  weight_mode: distance_to_boundary # uniform, cosine, gaussian, distance_to_boundary, spherediff_center
  spherediff_temperature: 0.1
  alpha: 1.0
  power: 1.0
  epsilon: 1.0e-6
  uncovered_mode: keep_previous

performance:
  view_batch_size: 1
  vae_chunk_size: 1

output:
  directory: outputs
  save_final: true
  save_metadata: true
  save_intermediate: false
  run_id: null

debug:
  enabled: false
  save_views_before_denoise: false
  save_views_after_denoise: false
  save_erp_each_step: false
  save_masks: false
  save_weights: false
  save_lod_maps: false
  measure_performance: false
